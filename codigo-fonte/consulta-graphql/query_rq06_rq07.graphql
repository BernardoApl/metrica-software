query ColetarRepositoriosRQ06RQ07(
  $queryString: String!
  $first: Int!
  $after: String
) {
  search(type: REPOSITORY, query: $queryString, first: $first, after: $after) {
    repositoryCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on Repository {
        nameWithOwner
        url
        updatedAt
        primaryLanguage {
          name
        }
        issues(first: 1) {
          totalCount
        }
        closedIssues: issues(first: 1, states: CLOSED) {
          totalCount
        }
        mergedPullRequests: pullRequests(first: 1, states: MERGED) {
          totalCount
        }
        releases(first: 1) {
          totalCount
        }
      }
    }
  }
  rateLimit {
    limit
    remaining
    used
    resetAt
  }
}
